name: KnittingCalculator
options:
  bundleIdPrefix: com.phillon
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 9CFPAUL5N5
packages:
  ShortRowKit:
    path: Packages/ShortRowKit
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.9.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
  KnittingCalculatorCore:
    path: Packages/KnittingCalculatorCore
targets:
  KnittingCalculator:
    type: application
    platform: iOS
    info:
      path: KnittingCalculator/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GADApplicationIdentifier: $(CALCULATOR_ADMOB_APP_ID)
        CalculatorBannerAdUnitID: $(CALCULATOR_BANNER_ID)
        CalculatorAdsReady: $(CALCULATOR_ADS_READY)
        GADDelayAppMeasurementInit: true
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: KnittingCalculator/Adjustment
      - path: KnittingCalculator/App
      - path: KnittingCalculator/Assets.xcassets
      - path: KnittingCalculator/Components
      - path: KnittingCalculator/Gauge
      - path: KnittingCalculator/Help
      - path: KnittingCalculator/Home
      - path: KnittingCalculator/Model
      - path: KnittingCalculator/StitchDictionary
      - path: KnittingCalculator/Settings
      - path: KnittingCalculator/Theme
      - path: KnittingCalculator/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: KnittingCalculator/LaunchScreen.storyboard
        buildPhase: resources
      - path: KnittingCalculator/Localization
        buildPhase: resources
    dependencies:
      - package: ShortRowKit
      - package: KnittingCalculatorCore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phillon.KnittingCalculator
        PRODUCT_MODULE_NAME: KnittingCalculator
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 5
        PRODUCT_NAME: KnittingCalculator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CALCULATOR_ADS_READY: "YES"
        CALCULATOR_BANNER_ID: ca-app-pub-2353011769485623/1883207041
        CALCULATOR_ADMOB_APP_ID: ca-app-pub-2353011769485623~3090056510
      configs:
        Debug:
          # Debug uses Google's test app and unit, never production inventory.
          CALCULATOR_ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          CALCULATOR_BANNER_ID: ca-app-pub-3940256099942544/2934735716
  KnittingCalculatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KnittingCalculatorTests
    dependencies:
      - target: KnittingCalculator
      - package: KnittingCalculatorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phillon.KnittingCalculatorTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KnittingCalculator:
    build:
      targets:
        KnittingCalculator: all
        KnittingCalculatorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KnittingCalculatorTests
