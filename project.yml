name: KnitNote
options:
  bundleIdPrefix: com.phillon
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 9CFPAUL5N5
targets:
  KnitNote:
    type: application
    supportedDestinations: [iOS, macOS]
    info:
      path: KnitNote/Info.plist
      properties:
        CFBundleDisplayName: KnitNote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KnitNoteSourceRevision: $(KNITNOTE_SOURCE_REVISION)
        CFBundleLocalizations: [en, zh-Hant, zh-Hans, de, fr, ja, nb, sv, fi, da, ko, el]
        CFBundleURLTypes:
          - CFBundleURLName: com.phillon.KnitNote
            CFBundleURLSchemes:
              - knitnote
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchStoryboardName: LaunchScreen
        NSCameraUsageDescription: Take photos for knitting projects, journal entries, and yarn labels.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.phillon.KnitNote.backup
            UTTypeDescription: KnitNote Backup
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - knitnote-backup
    sources:
      - path: KnitNote
        excludes:
          - "Info 2.plist"
          - LaunchScreen.storyboard
          - Localization/InfoPlist.xcstrings
          - PrivacyInfo.xcprivacy
          - StoreKit/KnitNote.storekit
      - path: KnitNote/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: KnitNote/Localization/InfoPlist.xcstrings
        buildPhase: resources
        destinationFilters: [iOS]
      - path: KnitNote/LaunchScreen.storyboard
        buildPhase: resources
        destinationFilters: [iOS]
      - path: Sources/KnitNoteCore
    dependencies:
      - target: KnitNoteWatch
        embed: true
        platformFilter: iOS
      - target: KnitNoteShare
        embed: true
        platformFilter: iOS
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phillon.KnitNote
        MARKETING_VERSION: 1.4.1
        CURRENT_PROJECT_VERSION: 8
        KNITNOTE_SOURCE_REVISION: UNSET
        PRODUCT_NAME: KnitNote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": KnitNote/KnitNote-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": KnitNote/KnitNote-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": KnitNote/KnitNote-iOS.entitlements
  KnitNoteWatch:
    type: application
    platform: watchOS
    info:
      path: KnitNoteWatch/Info.plist
      properties:
        CFBundleDisplayName: KnitNote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KnitNoteSourceRevision: $(KNITNOTE_SOURCE_REVISION)
        CFBundleLocalizations: [en, zh-Hant, zh-Hans, de, fr, ja, nb, sv, fi, da, ko, el]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.phillon.KnitNote
    sources:
      - path: KnitNoteWatch
        excludes:
          - PrivacyInfo.xcprivacy
      - path: KnitNoteWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/KnitNoteCore
        excludes:
          - App/AppVersionInfo.swift
          - App/KnitNoteMacWindowSizingPolicy.swift
          - Calculators/PatternCalculator.swift
          - Launch/LaunchExperienceCoordinator.swift
          - Patterns/PatternLibraryImportPresentation.swift
          - Patterns/PatternInboxProcessing.swift
          - Patterns/PatternLibraryIndex.swift
          - Patterns/PatternReaderAppearance.swift
          - Patterns/PatternReaderAppearancePresentation.swift
          - Patterns/PatternReaderContext.swift
          - Patterns/PatternShareInboxEnqueuer.swift
          - Patterns/PatternShareImportPresentation.swift
          - Patterns/PatternSystemAppearanceObservation.swift
          - Patterns/ProjectPatternImportPresentation.swift
          - Patterns/ProjectPatternLinkIndex.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phillon.KnitNote.watch
        MARKETING_VERSION: 1.4.1
        CURRENT_PROJECT_VERSION: 8
        KNITNOTE_SOURCE_REVISION: UNSET
        PRODUCT_NAME: KnitNoteWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KnitNoteShare:
    type: app-extension
    platform: iOS
    info:
      path: KnitNoteShare/Info.plist
      properties:
        CFBundleDisplayName: KnitNote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KnitNoteSourceRevision: $(KNITNOTE_SOURCE_REVISION)
        CFBundleLocalizations: [en, zh-Hant, zh-Hans, de, fr, ja, nb, sv, fi, da, ko, el]
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule: 'extensionItems.@count == 1 AND SUBQUERY(extensionItems, $extensionItem, $extensionItem.attachments.@count == 1 AND SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.png" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.jpeg" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.heic").@count == 1).@count == 1'
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    sources:
      - path: KnitNoteShare
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: KnitNoteShare/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/KnitNoteCore/Patterns/PatternAsset.swift
      - path: Sources/KnitNoteCore/Patterns/PatternDocument.swift
      - path: Sources/KnitNoteCore/Patterns/PatternPDFScalePolicy.swift
      - path: Sources/KnitNoteCore/Patterns/PatternFileService.swift
      - path: Sources/KnitNoteCore/Patterns/PatternInboxFileService.swift
      - path: Sources/KnitNoteCore/Patterns/PatternInboxItem.swift
      - path: Sources/KnitNoteCore/Patterns/PatternMarkup.swift
      - path: Sources/KnitNoteCore/Patterns/PatternMarkupFileService.swift
      - path: Sources/KnitNoteCore/Patterns/PatternShareInboxEnqueuer.swift
      - path: Sources/KnitNoteCore/Patterns/PatternShareImportPresentation.swift
      - path: Sources/KnitNoteCore/Patterns/PatternStorageLocations.swift
      - path: Sources/KnitNoteCore/Patterns/YouTubePatternLink.swift
      - path: Sources/KnitNoteCore/Patterns/YouTubePatternMetadata.swift
      - path: Sources/KnitNoteCore/Entitlements/EntitlementProjection.swift
      - path: Sources/KnitNoteCore/Entitlements/EntitlementSnapshot.swift
      - path: Sources/KnitNoteCore/Localization/AppLanguage.swift
      - path: Sources/KnitNoteCore/Localization/LanguageSettings.swift
      - path: Sources/KnitNoteCore/Localization/LanguageSelectionProjection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phillon.KnitNote.share
        CODE_SIGN_ENTITLEMENTS: KnitNoteShare/KnitNoteShare.entitlements
        MARKETING_VERSION: 1.4.1
        CURRENT_PROJECT_VERSION: 8
        KNITNOTE_SOURCE_REVISION: UNSET
        PRODUCT_NAME: KnitNoteShare
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  KnitNoteAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/KnitNoteAppTests
    dependencies:
      - target: KnitNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phillon.KnitNoteAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/KnitNote.app/Contents/MacOS/KnitNote
        BUNDLE_LOADER: $(TEST_HOST)
  KnitNoteMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/KnitNoteMacUITests
    dependencies:
      - target: KnitNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phillon.KnitNoteMacUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KnitNote
schemes:
  KnitNote:
    build:
      targets:
        KnitNote: all
    test:
      targets:
        - KnitNoteAppTests
        - KnitNoteMacUITests
    run:
      config: Debug
      storeKitConfiguration: KnitNote/StoreKit/KnitNote.storekit
    archive:
      config: Release
  KnitNoteWatch:
    build:
      targets:
        KnitNoteWatch: all
    run:
      config: Debug
    archive:
      config: Release
  KnitNoteShare:
    build:
      targets:
        KnitNoteShare: all
    archive:
      config: Release
